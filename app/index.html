<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電卓 | test-github-actions</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>電卓</h1>
      <p class="lead">
        GitHub Actions と Vercel の学習用サンプル。計算ロジックは
        <code>src/calculator.ts</code> にあり、同じ関数をテストからも呼んでいます。
      </p>

      <form id="calc-form" class="calc">
        <label class="field">
          <span>左辺</span>
          <input id="lhs" name="lhs" type="number" value="10" step="any" required />
        </label>

        <label class="field">
          <span>演算子</span>
          <select id="operator" name="operator">
            <option value="add">+</option>
            <option value="subtract">−</option>
            <option value="multiply">×</option>
            <option value="divide">÷</option>
          </select>
        </label>

        <label class="field">
          <span>右辺</span>
          <input id="rhs" name="rhs" type="number" value="2" step="any" required />
        </label>

        <button type="submit">計算する</button>
      </form>

      <output id="result" class="result" role="status">ここに結果が表示されます</output>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
