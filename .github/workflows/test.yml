name: Test

# PR が作成・更新されたとき、および main へ push されたときに実行する
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じ PR で連続 push した場合、古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 は Node.js 22.13 以上を必要とするため 20 系は対象外
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node の cache: pnpm より前に pnpm を用意する必要がある
      # バージョンは package.json の packageManager から読み取られる
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      # 本番ビルドが壊れていないか確認する（Vercel でのデプロイと同じ工程）
      - name: Build
        run: pnpm run build
